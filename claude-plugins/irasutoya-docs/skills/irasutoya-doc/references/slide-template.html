<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  /* ============================================================
     irasutoya-doc スライドテンプレート
     - 16:9 スライド / 画面ではスクロール閲覧、印刷では1スライド1ページ
     - JS なし・外部 CDN なし・画像は images/ 配下のローカル参照
     ============================================================ */
  :root {
    --bg: #f2efe9;
    --paper: #fffdf8;
    --ink: #3a3a33;
    --ink-soft: #6f6a5d;
    --accent: #2a9d8f;
    --accent-soft: #e3f2ef;
    --warn: #e76f51;
    --warn-soft: #fdeee9;
    --line: #ddd6c8;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic",
      "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.6;
  }

  /* ---- スライド枠 ---- */
  .deck {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 28px 16px;
    counter-reset: slide;
  }
  .slide {
    width: min(1280px, 100%);
    aspect-ratio: 16 / 9;
    container-type: size;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 2px 10px rgba(60, 50, 20, 0.08);
    overflow: hidden;
    counter-increment: slide;
    position: relative;
  }
  .slide-inner {
    position: absolute;
    inset: 0;
    padding: 5cqh 5cqw;
    display: flex;
    flex-direction: column;
  }
  /* スライド番号（タイトルスライド以外に自動表示） */
  .slide::after {
    content: counter(slide);
    position: absolute;
    right: 2.4cqw;
    bottom: 1.6cqh;
    font-size: 2.4cqh;
    color: var(--ink-soft);
  }
  .slide--title::after { content: none; }

  /* ---- タイトルスライド ---- */
  .slide--title .slide-inner {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 3cqh;
    background:
      linear-gradient(180deg, var(--paper) 0%, var(--accent-soft) 100%);
  }
  .slide--title h1 { font-size: 8.5cqh; line-height: 1.3; }
  .slide--title .subtitle { font-size: 4cqh; color: var(--ink-soft); }
  .slide--title .hero img { height: 30cqh; width: auto; }
  .slide--title .credit {
    font-size: 2.6cqh;
    color: var(--ink-soft);
  }

  /* ---- セクション区切りスライド ---- */
  .slide--section .slide-inner {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 3cqh;
    background: var(--accent-soft);
  }
  .slide--section .section-no {
    font-size: 3.4cqh;
    color: var(--accent);
    font-weight: bold;
    letter-spacing: 0.2em;
  }
  .slide--section h2 { font-size: 7cqh; }
  .slide--section img { height: 26cqh; width: auto; }

  /* ---- コンテンツスライド共通 ---- */
  .slide-header {
    flex: none;
    border-bottom: 0.7cqh solid var(--accent);
    padding-bottom: 1.6cqh;
    margin-bottom: 3.4cqh;
  }
  .slide-header h2 { font-size: 5.4cqh; line-height: 1.3; }
  .slide-header .lead { font-size: 3cqh; color: var(--ink-soft); margin-top: 0.8cqh; }
  .slide-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3cqh;
    font-size: 3.4cqh;
  }

  /* ---- 2カラム（テキスト+画像 など） ---- */
  .cols { display: flex; gap: 4cqw; align-items: center; min-height: 0; flex: 1; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2cqh; justify-content: center; }
  .col--narrow { flex: 0.7; }

  /* ---- いらすとや画像 ---- */
  .irasuto {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1cqh;
    min-height: 0;
  }
  .irasuto img {
    max-height: 42cqh;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  .irasuto--large img { max-height: 56cqh; }
  .irasuto--small img { max-height: 24cqh; }
  .irasuto figcaption { font-size: 2.6cqh; color: var(--ink-soft); text-align: center; }

  /* ---- 箇条書き ---- */
  .bullets { list-style: none; display: flex; flex-direction: column; gap: 2.6cqh; }
  .bullets li { padding-left: 4.4cqw; position: relative; }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 1cqw; top: 1.6cqh;
    width: 1.8cqw; height: 1.8cqw;
    border-radius: 50%;
    background: var(--accent);
  }
  .bullets strong { color: var(--accent); }

  /* ---- カードグリッド ---- */
  .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.4cqw; flex: 1; min-height: 0; align-content: center; }
  .card-grid--2 { grid-template-columns: repeat(2, 1fr); }
  .card-grid--4 { grid-template-columns: repeat(4, 1fr); }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 2.4cqh 1.6cqw;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1.4cqh;
  }
  .card img { height: 16cqh; width: auto; max-width: 100%; object-fit: contain; }
  .card h3 { font-size: 3.2cqh; color: var(--accent); }
  .card p { font-size: 2.7cqh; color: var(--ink-soft); }

  /* ---- ステップフロー（画像つき手順） ---- */
  .step-flow { display: flex; align-items: stretch; gap: 0; flex: 1; min-height: 0; align-items: center; }
  .step {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1.4cqh;
    padding: 2cqh 1cqw;
  }
  .step img { height: 15cqh; width: auto; max-width: 100%; object-fit: contain; }
  .step .step-no {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    font-size: 2.6cqh;
    padding: 0.3cqh 1.8cqw;
  }
  .step h3 { font-size: 3cqh; }
  .step p { font-size: 2.5cqh; color: var(--ink-soft); }
  .step-arrow {
    flex: none;
    align-self: center;
    font-size: 4.5cqh;
    color: var(--accent);
  }

  /* ---- 数値ハイライト ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.4cqw; align-content: center; flex: 1; }
  .stat-grid--2 { grid-template-columns: repeat(2, 1fr); }
  .stat {
    background: var(--accent-soft);
    border-radius: var(--radius);
    padding: 3cqh 1.6cqw;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 1cqh;
    align-items: center;
  }
  .stat img { height: 12cqh; width: auto; object-fit: contain; }
  .stat .stat-value { font-size: 7cqh; font-weight: bold; color: var(--accent); line-height: 1.2; }
  .stat .stat-label { font-size: 2.8cqh; color: var(--ink-soft); }

  /* ---- 比較（Before/After・○×） ---- */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4cqw; flex: 1; align-content: center; }
  .compare-pane {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 2.4cqh 2cqw;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1.6cqh;
  }
  .compare-pane img { height: 18cqh; width: auto; object-fit: contain; }
  .compare-pane h3 { font-size: 3.4cqh; }
  .compare-pane p { font-size: 2.8cqh; color: var(--ink-soft); }
  .compare-pane--bad { background: var(--warn-soft); }
  .compare-pane--bad h3 { color: var(--warn); }
  .compare-pane--good { background: var(--accent-soft); }
  .compare-pane--good h3 { color: var(--accent); }

  /* ---- 表 ---- */
  .slide-table { width: 100%; border-collapse: collapse; font-size: 2.9cqh; }
  .slide-table th, .slide-table td {
    border: 1px solid var(--line);
    padding: 1.4cqh 1.4cqw;
    text-align: left;
  }
  .slide-table th { background: var(--accent-soft); color: var(--ink); }

  /* ---- コールアウト ---- */
  .callout {
    border-radius: var(--radius);
    padding: 2cqh 2cqw;
    font-size: 3cqh;
    display: flex;
    align-items: center;
    gap: 2cqw;
    background: var(--accent-soft);
    border-left: 1cqw solid var(--accent);
  }
  .callout--warning { background: var(--warn-soft); border-left-color: var(--warn); }
  .callout img { height: 10cqh; width: auto; flex: none; }

  /* ---- 印刷（PDF 化） ---- */
  @page { size: 1280px 720px; margin: 0; }
  @media print {
    body { background: #fff; }
    .deck { padding: 0; gap: 0; display: block; }
    .slide {
      width: 1280px;
      height: 720px;
      aspect-ratio: auto;
      border: none;
      border-radius: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .slide:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<main class="deck">

  <!-- タイトルスライド -->
  <section class="slide slide--title">
    <div class="slide-inner">
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      {{HERO}}
      <p class="credit">{{DATE}}　{{AUTHOR}}</p>
    </div>
  </section>

{{SLIDES}}

</main>
<!-- {{META}} / イラスト: いらすとや (https://www.irasutoya.com) -->
</body>
</html>
